[package]
name = "matrix-channel"
version = "0.1.0"
edition = "2021"
description = "Matrix messaging channel for IronClaw with E2EE support"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WIT bindgen for WASM component model
wit-bindgen = "0.36"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# E2EE: Olm/Megolm cryptographic ratchets (pure Rust, no C deps)
vodozemac = "0.8"

# Base64 encoding for host-encrypted pickle data
base64 = "0.22"

[profile.release]
# Optimize for size
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
